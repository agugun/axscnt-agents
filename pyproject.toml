[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opmagent"
version = "0.3.0"
description = "Agent system for OPM Flow reservoir simulation: fluid, geo, res and well modelers, deck builder, run agent, deck importer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3",
  "neqsim>=3.29",
  "numpy",
  "pandas",
  "openpyxl",
  "jinja2",
  "plotly>=5.22",          # textfont.shadow (geo review workbench labels)
  # QC notebooks: executed headlessly in a kernel of this interpreter, exported to HTML
  "nbformat>=5.9",
  "nbclient>=0.10",
  "nbconvert>=7",
  "ipykernel>=6",
]

[project.optional-dependencies]
geo = ["lasio", "gstools"]
# all agents need these at runtime; kept as extras so the core installs without them
opm = ["opm>=2025.10", "opm-simulators>=2025.10"]
dev = ["pytest"]

[project.scripts]
opmagent = "opmagent.cli:main"
opmagent-data = "opmagent.servers.data_server:main"
opmagent-pvt = "opmagent.servers.pvt_server:main"
opmagent-sim = "opmagent.servers.sim_server:main"
opmagent-hm = "opmagent.servers.hm_server:main"

[tool.pytest.ini_options]
# e2e: the whole study cycle with Flow and history matching (tests/test_study_e2e.py). Opt-in: `pytest -m e2e`;
# `pytest -m ""` runs everything.
markers = ["e2e: end-to-end business process (slow, needs OPM Flow); opt-in with -m e2e"]
addopts = "-m 'not e2e'"

[tool.setuptools.packages.find]
include = ["opmagent*"]

[tool.setuptools.package-data]
opmagent = ["core/*.sql", "notebooks/*.ipynb", "geo/review_static/*"]
