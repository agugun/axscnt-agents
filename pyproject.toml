[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opmagent"
version = "0.1.0"
description = "Agent system for OPM Flow reservoir simulation: fluid, geo and well modelers, deck builder, run agent, deck importer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
  "neqsim>=3.29",
  "numpy",
  "pandas",
  "openpyxl",
  "jinja2",
  "plotly",
]

[project.optional-dependencies]
geo = ["lasio", "gstools"]
dev = ["pytest"]

[project.scripts]
opmagent = "opmagent.cli:main"

[tool.setuptools.packages.find]
include = ["opmagent*"]

[tool.setuptools.package-data]
opmagent = ["core/*.sql"]
