[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opmagent"
version = "0.2.0"
description = "Agent system for OPM Flow reservoir simulation: fluid, geo and well modelers, deck builder, run agent, deck importer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3",
  "neqsim>=3.29",
  "numpy",
  "pandas",
  "openpyxl",
  "jinja2",
  "plotly",
  # QC notebooks: executed headlessly in a kernel of this interpreter, exported to HTML
  "nbformat>=5.9",
  "nbclient>=0.10",
  "nbconvert>=7",
  "ipykernel>=6",
]

[project.optional-dependencies]
geo = ["lasio", "gstools"]
# all agents need these at runtime; kept as extras so the core installs without them
opm = ["opm>=2025.10", "opm-simulators>=2025.10"]
dev = ["pytest"]

[project.scripts]
opmagent = "opmagent.cli:main"
opmagent-data = "opmagent.servers.data_server:main"
opmagent-pvt = "opmagent.servers.pvt_server:main"
opmagent-sim = "opmagent.servers.sim_server:main"

[tool.setuptools.packages.find]
include = ["opmagent*"]

[tool.setuptools.package-data]
opmagent = ["core/*.sql", "notebooks/*.ipynb"]
