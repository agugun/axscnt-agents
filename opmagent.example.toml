# Copy to opmagent.toml (or ~/.config/opmagent/opmagent.toml) and edit.

[paths]
database   = "~/opmagent/opm.db"
file_store = "~/opmagent/files"        # inbox/ lives here
flow_bin   = "flow"

[defaults]
unit_system       = "METRIC"
eos               = "PR"               # PR, PR78 or SRK
volume_shift      = true
pseudo_components = 6

[tolerances]
psat = 0.02
bo   = 0.02
rs   = 0.03
mu_o = 0.10

[simulation]
max_parallel = 2

[debug]
# Only for debug_simulation (VS Code, step through OPM's code). Runs always use [paths] flow_bin, a release Flow:
# a Debug build is many times slower, and opmagent refuses a flow_bin that points at opm_debug_flow.
# opm_source_root = "~/src/opm"
# opm_debug_flow  = "~/src/opm/build/opm-simulators/bin/flow"
vscode_bin = "code"

[study]
# true: a model that passes its validator is approved automatically (recorded in approvals as
# "auto (approval disabled)"); models with validator errors still stop. false: you approve each model.
auto_approve = false

[qc]
# notebook: the QC report is the standard Jupyter template (opmagent/notebooks/fluid_qc.ipynb), executed
# headlessly and exported to HTML; the .ipynb is kept next to it. html: the older static report.
report    = "notebook"
timeout_s = 600

[viewer]
# ResInsight launcher, for the results viewer (opmagent results open)
# resinsight_bin = "/opt/ResInsight/bin/resinsight"   # only if ResInsight isn't on PATH or in /opt/ResInsight

[hm]
# History-match variants (opmagent-hm, `opmagent hm`): how many run at once, threads each, memory kept free
# parallel = 4              # default: cores / (2 x threads); ordinary runs in progress take a slot each
threads = 2
min_free_mb = 1024
# case_memory_mb = 2000     # default: 300 MB + 20 kB per cell
case_timeout_s = 3600
min_free_disk_mb = 2048
# keep_grid_output = true   # keep each variant's restart/INIT/EGRID (Norne: ~300 MB a case); default: summary only
