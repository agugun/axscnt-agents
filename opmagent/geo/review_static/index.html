<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geo review</title>
<script src="/static/plotly.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #637083; --line: #dde2ea; --accent: #2860c8;
  --accent-ink: #ffffff; --pass: #2b8a3e; --warn: #b7791f; --fail: #c92a2a; --pin: #d62728; --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171c; --panel: #1c2027; --ink: #e5e9f0; --muted: #98a2b3; --line: #2e3440; --accent: #6b9bf2;
          --accent-ink: #0d1117; --chip: #262b34; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel);
         border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.badge { padding: 2px 8px; border-radius: 10px; background: var(--chip); font-size: 12px; }
.badge.pass { color: var(--pass); } .badge.warn { color: var(--warn); } .badge.fail { color: var(--fail); }
header .spacer { flex: 1; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; padding: 12px 16px; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tabs button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 5px 10px;
               border-radius: 6px; cursor: pointer; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; min-height: 30px; }
.controls label { color: var(--muted); font-size: 12px; display: flex; gap: 4px; align-items: center; }
select, input, textarea, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                                  border-radius: 6px; padding: 4px 6px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); cursor: pointer; }
button.link { border: none; background: none; color: var(--accent); padding: 0; cursor: pointer; }
#plot { width: 100%; min-height: 460px; }
#qcpane { display: none; }
#newver { display: none; margin: 8px 16px 0; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px;
          background: var(--panel); }
#qcchange { margin-bottom: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--chip);
            font-size: 13px; }
#qcchange:empty { display: none; }
#qcchange table { border-collapse: collapse; font-size: 12px; margin: 4px 0; }
#qcchange td { padding: 1px 10px 1px 0; }
#qcchange .acts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
#qcframe { width: 100%; height: 75vh; border: 1px solid var(--line); border-radius: 6px; background: #fff; margin-top: 8px; }
#findings { margin: 0; padding: 0; }
#qcnote { margin-top: 6px; }
#qcnote a, #decide a { color: var(--accent); }
.steps { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 0; }
.steps button { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--panel);
                border-radius: 8px; padding: 6px 12px; cursor: pointer; text-align: left; }
.steps .n { width: 20px; height: 20px; border-radius: 50%; background: var(--chip); display: inline-flex;
            align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
.steps .t { font-weight: 600; }
.steps .s { font-size: 12px; color: var(--muted); }
.steps .s.you { color: var(--warn); } .steps .s.block { color: var(--fail); }
.steps button.now { border-color: var(--accent); }
.steps button.now .n { background: var(--accent); color: var(--accent-ink); }
.steps button.done .n { background: var(--pass); color: #fff; }
#findings li { cursor: pointer; padding: 4px 0; border-bottom: 1px solid var(--line); list-style: none; }
#findings li:hover { color: var(--accent); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0 8px; }
.sel { background: var(--chip); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
.sel .lbl { font-weight: 600; }
.sel table { border-collapse: collapse; margin-top: 4px; font-size: 12px; }
.sel td { padding: 1px 8px 1px 0; }
.sel .acts { margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.msg { font-size: 12px; color: var(--muted); }
.msg.err { color: var(--fail); }
.c { border-top: 1px solid var(--line); padding: 8px 0; }
.c.hl { background: color-mix(in srgb, var(--pin) 10%, transparent); }
.c .top { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; font-size: 12px; color: var(--muted); }
.c .top b { color: var(--pin); }
.c .body { margin: 3px 0; white-space: pre-wrap; }
.c .ans { margin-left: 10px; padding-left: 8px; border-left: 2px solid var(--line); white-space: pre-wrap; }
.st-open { color: var(--warn); } .st-addressed { color: var(--pass); } .st-wontfix { color: var(--muted); }
code { background: var(--chip); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
.m { margin: 4px 0 4px 10px; padding: 4px 0 4px 8px; border-left: 2px solid var(--line); }
.m.modeler { border-left-color: var(--accent); }
.m .who { font-size: 12px; color: var(--muted); }
.m .who b { color: var(--ink); font-weight: 600; }
.m .txt { white-space: pre-wrap; }
.kind { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--chip); }
.prop { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 4px 0; background: var(--chip); }
.prop table { border-collapse: collapse; font-size: 12px; margin: 4px 0; }
.prop td { padding: 1px 8px 1px 0; }
.prop .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.prop input { flex: 1; min-width: 120px; }
.wait { font-size: 11px; font-weight: 600; }
#decide { margin-top: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; display: none; }
#decide input { width: 100%; margin: 4px 0; }
#decide .block { color: var(--fail); font-size: 12px; }
#decide .warnq { color: var(--warn); font-size: 12px; }
button.danger { border-color: var(--fail); color: var(--fail); background: transparent; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.wait.you { color: var(--warn); } .wait.agent { color: var(--accent); }
.reply { margin: 4px 0 0 10px; }
.reply textarea { min-height: 50px; }
#session { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--pass); }
#diffinfo { display: none; margin-top: 10px; font-size: 12px; }
#diffinfo table { border-collapse: collapse; width: 100%; margin: 4px 0 10px; }
#diffinfo td, #diffinfo th { text-align: left; padding: 2px 8px 2px 0; border-bottom: 1px solid var(--line); }
.knobs { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.knobs input[type=number] { width: 80px; }
.knobs .changed { outline: 2px solid var(--warn); }
#diffinfo td.num { text-align: right; font-variant-numeric: tabular-nums; }
#diffinfo h3 { font-size: 12px; margin: 8px 0 2px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<header>
  <h1 id="title">Geo review</h1>
  <select id="version" aria-label="Version"></select>
  <span id="status" class="badge"></span>
  <span class="spacer"></span>
  <span id="session"></span>
</header>
<nav class="steps" id="steps" aria-label="Review steps"></nav>
<div id="newver" role="status"></div>
<main>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="controls" id="controls"></div>
    <div id="plot"></div>
    <div id="qcpane"><div id="qcchange"></div><ul id="findings"></ul><div class="msg" id="qcnote"></div><iframe id="qcframe" title="QC report"></iframe></div>
    <div id="diffinfo"></div>
    <div class="msg" id="hint">Click on a picture (a well, a cell, a curve, a contact) or a QC finding to pin a comment on it.</div>
  </section>
  <section class="panel">
    <h2>Comment</h2>
    <div class="sel" id="sel"></div>
    <textarea id="text" placeholder="What should change, or what do you want to know?"></textarea>
    <div class="row">
      <select id="severity" aria-label="Severity">
        <option value="change">change</option><option value="question">question</option><option value="note">note</option>
      </select>
      <button class="primary" id="post">Post comment</button>
      <span class="msg" id="postmsg"></span>
    </div>
    <div class="msg" id="cmds"></div>
    <div id="decide"></div>
    <h2 style="margin-top:16px">Comments on this model</h2>
    <div class="row" style="margin-top:0">
      <label class="msg"><input type="checkbox" id="onlyv"> this version only</label>
      <label class="msg"><input type="checkbox" id="onlyopen"> open only</label>
      <label class="msg"><input type="checkbox" id="onlyme"> waiting on me</label>
    </div>
    <div id="comments"></div>
  </section>
</main>
<script>
"use strict";
const TABS = [["findings", "QC report"], ["surfaces", "Surfaces"], ["layer_map", "Layer map"], ["section", "Section"], ["well", "Well"],
              ["at_wells", "At wells"], ["distributions", "Distributions"], ["poroperm", "Poro-perm"],
              ["kr", "Rel perm"], ["pc", "Cap pressure"], ["regions", "Regions"], ["contacts", "Contacts"],
              ["contact_section", "Contact section"], ["aquifers", "Aquifers"],
              ["plan", "Plan"], ["well_section", "Well path"], ["perforated_cells", "Perforated cells"], ["history", "History"],
              ["cumulative", "Cumulative"], ["schedule", "Schedule"],
              ["diff_map", "Diff"], ["diff", "Diff"], ["whatif", "What-if"]];
const GEO = () => S.meta.kind === "geo";
const AGENT = () => `${S.meta.kind} agent`;
let token = "";
try { token = new URLSearchParams(location.hash.slice(1)).get("token") || sessionStorage.getItem("geoReviewToken") || ""; } catch (e) {}
try { if (token) sessionStorage.setItem("geoReviewToken", token); } catch (e) {}
// a restarted server makes a new token; opening its link in this tab only changes the fragment
addEventListener("hashchange", () => {
  const t = new URLSearchParams(location.hash.slice(1)).get("token");
  if (t) { token = t; try { sessionStorage.setItem("geoReviewToken", t); } catch (e) {} }
});
const qs = new URLSearchParams(location.search);
const S = { vid: +qs.get("version_id"), meta: null, tab: "layer_map", spec: {}, anchor: {}, viewForComment: null, comments: [],
            proposals: {}, session: {}, qcSeen: new Set(), replyOpen: new Set(), drafts: {}, lastSig: "", diff: null, preview: null, knobs: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", body: JSON.stringify(body),
    headers: { "Content-Type": "application/json", "X-Review-Token": token } };
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!j.ok) throw new Error(j.message || r.statusText);
  return j;
}

function dark() { return matchMedia("(prefers-color-scheme: dark)").matches; }

async function loadMeta() {
  const m = await api(`/api/meta?version_id=${S.vid}`);
  S.meta = m;
  document.title = `${m.kind[0].toUpperCase() + m.kind.slice(1)} review: ${m.model_name} v${m.version}`;
  $("title").textContent = `${m.model_name} v${m.version}`;
  $("status").textContent = m.status;
  renderVersions(m.versions);
  if (!m.views.length) $("hint").textContent = "Click a QC finding to pin a comment on it; the plots are in the QC report.";
  $("cmds").innerHTML = m.review_commands && !(m.decision || {}).can_decide
    ? "Approve or reject in your terminal" + ((m.decision || {}).can_decide === false ? " (this workbench was started without one)" : "")
      + ": " + m.review_commands.map(c => `<code>${esc(c)}</code>`).join(" ") : "";
  renderDecision(m.decision);
  renderSteps();
  if (!S.spec.fig) S.spec = m.kind === "geo" ? { fig: "layer_map", kw: m.keywords.includes("PORO") ? "PORO" : m.keywords[0], layer: 1 }
                                              : defaultSpec(m.views[0]);
}

function tabs() {
  const ok = new Set([...(S.meta.views || []), "findings", ...(GEO() ? [] : ["diff"]), ...(S.meta.can_preview ? ["whatif"] : [])]);
  $("tabs").innerHTML = TABS.filter(([k]) => ok.has(k)).map(([k, n]) => `<button data-t="${k}" class="${k === S.tab ? "on" : ""}">${n}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => openTab(b.dataset.t));
}

function defaultSpec(fig) {
  const s = { fig };
  ((S.meta.view_args || {})[fig] || []).forEach(a => {
    if (a.choices && a.choices.length) s[a.name] = a.choices[0];
    else if (a.name === "layer") s.layer = 1;
  });
  return s;
}

function genericControls() {
  const s = S.spec, el = $("controls");
  let h = "";
  if (S.tab === "diff") {
    const others = S.meta.versions.filter(v => v.version_id !== S.vid);
    if (S.diff && S.diff.base_version_id) {
      h += `<label>Against <select id="base">${others.map(v => `<option value="${v.version_id}" ${v.version_id === S.diff.base_version_id ? "selected" : ""}>v${v.version}</option>`).join("")}</select></label>`;
      if (S.meta.kind === "res") h += `<label>Show <select id="dfig">${["kr", "pc", "contacts"].filter(f => S.meta.views.includes(f)).map(f => `<option ${f === s.fig ? "selected" : ""}>${f}</option>`).join("")}</select></label>`;
    }
  } else {
    ((S.meta.view_args || {})[s.fig] || []).forEach(a => {
      if (a.choices) h += `<label>${esc(a.name)} <select data-arg="${esc(a.name)}">${a.choices.map(c => `<option ${String(c) === String(s[a.name]) ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>`;
      else h += `<label>${esc(a.name)} <input type="number" data-arg="${esc(a.name)}" min="${a.min}" max="${a.max}" value="${s[a.name] ?? ""}" placeholder="${a.min}-${a.max}"></label>`;
    });
  }
  el.innerHTML = h;
  el.querySelectorAll("[data-arg]").forEach(x => x.onchange = () => {
    const v = x.value;
    s[x.dataset.arg] = x.tagName === "INPUT" ? +v : (isNaN(+v) || v === "" ? v : +v);
    draw();
  });
  const b = $("base"); if (b) b.onchange = e => loadDiff(+e.target.value);
  const f = $("dfig"); if (f) f.onchange = e => { S.spec = { fig: e.target.value, base_version_id: S.diff.base_version_id }; draw(); };
}

function controls() {
  if (S.tab === "whatif") return whatifControls();
  if (!GEO()) return genericControls();
  const m = S.meta, s = S.spec, el = $("controls");
  const opt = (arr, v) => arr.map(a => `<option ${String(a) === String(v) ? "selected" : ""}>${esc(a)}</option>`).join("");
  let h = "";
  if (s.fig === "layer_map" || s.fig === "section")
    h += `<label>Property <select id="kw">${opt(m.keywords, s.kw)}</select></label>
          <label><input type="checkbox" id="log" ${s.log ?? s.kw.startsWith("PERM") ? "checked" : ""}> log10</label>`;
  if (s.fig === "layer_map") {
    const z = m.zones.find(z => z.first <= s.layer && s.layer <= z.last);
    h += `<label>Layer <input type="range" id="layer" min="1" max="${m.grid[2]}" value="${s.layer}">
          <span>${s.layer} / ${m.grid[2]}${z ? " (" + esc(z.zone) + ")" : ""}</span></label>`;
  }
  if (s.fig === "section")
    h += `<label>Along <select id="along">${opt(["x", "y"], s.along || "x")}</select></label>
          <label>Through <select id="through">${s.cell ? `<option value="cell" selected>cell ${s.cell.join(",")}</option>` : ""}${opt(m.wells, s.well)}</select></label>`;
  if (s.fig === "well") h += `<label>Well <select id="wellsel">${opt(m.wells, s.well)}</select></label>`;
  if (s.fig === "diff_map" && S.diff && S.diff.base_version_id) {
    const others = m.versions.filter(v => v.version_id !== S.vid);
    h += `<label>Against <select id="base">${others.map(v => `<option value="${v.version_id}" ${v.version_id === s.base_version_id ? "selected" : ""}>v${v.version}</option>`).join("")}</select></label>
          <label>Property <select id="kw">${opt(S.diff.keywords, s.kw)}</select></label>`;
    if (S.diff.maps === "layer") h += `<label>Layer <input type="range" id="layer" min="1" max="${S.diff.nz}" value="${s.layer || 1}"> <span>${s.layer || 1}</span></label>`;
    else if (S.diff.maps === "zone") h += `<label>Zone <select id="zone">${opt(S.diff.zones, s.zone)}</select></label>`;
  }
  el.innerHTML = h;
  const on = (id, fn) => { const x = $(id); if (x) x.oninput = fn; };
  on("kw", e => { s.kw = e.target.value; delete s.log; draw(); });
  on("log", e => { s.log = e.target.checked; draw(); });
  on("layer", e => { s.layer = +e.target.value; draw(); });
  on("along", e => { s.along = e.target.value; draw(); });
  on("through", e => { if (e.target.value !== "cell") { s.well = e.target.value; delete s.cell; } draw(); });
  on("wellsel", e => { s.well = e.target.value; draw(); });
  on("base", e => { loadDiff(+e.target.value); });
  on("zone", e => { s.zone = e.target.value; draw(); });
}

function openTab(t, spec) {
  S.tab = t;
  tabs();
  const isF = t === "findings";
  $("qcpane").style.display = isF ? "block" : "none";
  $("plot").style.display = isF ? "none" : "block";
  $("diffinfo").style.display = t === "diff_map" ? "block" : "none";
  if (isF) { $("controls").innerHTML = ""; findings(); return; }
  if (t === "diff_map" && !spec) { loadDiff(S.spec.fig === "diff_map" && !S.spec.preview_id ? S.spec.base_version_id : null); return; }
  if (t === "diff") { $("diffinfo").style.display = "block"; loadDiff(S.diff ? S.diff.base_version_id : null); return; }
  $("diffinfo").style.display = (t === "diff_map" || t === "whatif") ? "block" : "none";
  if (t === "whatif") {
    if (spec) S.spec = { ...spec };
    else if (!S.spec.preview_id) S.spec = {};
    whatifControls(); renderPreviewInfo();
    if (S.spec.preview_id) draw(); else { Plotly.purge("plot"); $("plot").innerHTML = `<p class="msg">Change the settings above and press Preview: a scratch build on this version's data, compared with v${S.meta.version}. Nothing is saved as a version.</p>`; }
    return;
  }
  if (spec) S.spec = { ...spec };
  else if (!GEO()) { if (S.spec.fig !== t || S.spec.preview_id || S.spec.base_version_id) S.spec = defaultSpec(t); }
  else if (S.spec.fig !== t) {
    const kw = S.spec.kw || (S.meta.keywords.includes("PORO") ? "PORO" : S.meta.keywords[0]);
    S.spec = { fig: t };
    if (t === "layer_map") Object.assign(S.spec, { kw, layer: 1 });
    if (t === "section") Object.assign(S.spec, { kw, along: "x", well: S.meta.wells[0] });
    if (t === "well") S.spec.well = S.meta.wells[0];
  }
  draw();
}

async function draw() {
  controls();
  if (S.tab === "whatif" && !S.spec.preview_id) return;
  if (S.tab === "diff" && (!S.spec.fig || !S.diff || !S.diff.base_version_id)) {
    Plotly.purge("plot");
    $("plot").innerHTML = `<p class="msg">${!S.diff || !S.diff.base_version_id ? "No earlier version to compare with." : "The numbers below are the comparison."}</p>`;
    return;
  }
  if (S.spec.fig === "diff_map" && !S.spec.preview_id && (!S.diff || !S.diff.base_version_id || !S.diff.maps)) {
    Plotly.purge("plot");
    $("plot").innerHTML = `<p class="msg">${!S.diff || !S.diff.base_version_id ? "No earlier version to compare with." : "The versions have different areal grids: compare their maps side by side."}</p>`;
    return;
  }
  const spec = { ...S.spec, version_id: S.vid };
  try {
    const r = await api("/api/view", { spec });
    S.spec = r.spec;
    const fig = r.figure;
    fig.layout = fig.layout || {};
    if (dark()) {
      fig.layout.template = undefined;
      Object.assign(fig.layout, { paper_bgcolor: "#1c2027", plot_bgcolor: "#1c2027", font: { color: "#e5e9f0" } });
    }
    fig.layout.autosize = true;
    $("plot").querySelectorAll(":scope > p.msg").forEach(e => e.remove());     // a placeholder from before
    await Plotly.react("plot", fig.data, fig.layout, { responsive: true, displaylogo: false });
    $("plot").removeAllListeners?.("plotly_click");
    $("plot").on("plotly_click", onClick);
    controls();
  } catch (e) { $("hint").textContent = e.message; $("hint").className = "msg err"; }
}

async function onClick(ev) {
  const p = ev.points[0];
  if (!p) return;
  const meta = p.data.meta || {};
  if (meta.role === "skip") return;
  const point = { x: p.x, y: p.y, text: Array.isArray(p.data.text) ? p.data.text[p.pointIndex] : p.text,
                  customdata: p.customdata, ...meta };
  try {
    const r = await api("/api/locate", { spec: { ...S.spec, version_id: S.vid }, role: meta.role, point });
    if (r.comment) { highlight(r.comment); return; }
    select(r.anchor, r.label, r.describe, { ...S.spec });
  } catch (e) { $("hint").textContent = e.message; $("hint").className = "msg err"; }
}

function flatRows(d) {
  const rows = [];
  const fmt = v => v === null || v === undefined ? "–" : typeof v === "object" ? JSON.stringify(v).slice(0, 80) : v;
  const empty = v => v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)
                     || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length);
  Object.entries(d || {}).forEach(([k, v]) => {
    if (k === "label" || empty(v)) return;
    if (v && typeof v === "object" && !Array.isArray(v)) v = Object.fromEntries(Object.entries(v).filter(([, x]) => !empty(x)));
    if (Array.isArray(v)) { v.slice(0, 4).forEach((x, n) => rows.push([`${k} ${n + 1}`, fmt(x)])); if (v.length > 4) rows.push([k, `${v.length} in all`]); }
    else if (v && typeof v === "object") Object.entries(v).forEach(([kk, vv]) => rows.push([`${k} ${kk}`, fmt(vv)]));
    else rows.push([k, fmt(v)]);
  });
  return rows;
}

function select(anchor, label, describe, view) {
  if (S.meta && !GEO()) return selectGeneric(anchor, label, describe, view);
  S.anchor = anchor || {};
  S.viewForComment = view;
  const rows = [];
  const d = describe || {};
  if (d.cell) {
    rows.push(["Cell", `${d.cell.ijk.join(", ")} · zone ${d.cell.zone ?? "-"} · TVD ${d.cell.top_tvd}–${d.cell.base_tvd} m`]);
    Object.entries(d.cell.values).forEach(([k, v]) => rows.push([k, v]));
    if (d.cell.nearest_well) rows.push(["Nearest well", `${d.cell.nearest_well.well} (${d.cell.nearest_well.distance_m} m)`]);
  }
  if (d.well) {
    d.well.at_layers.forEach(l => rows.push([`${d.well.well} L${l.layer}`, `φ log ${l.phi_log} · model ${l.phi_model}`]));
    Object.entries(d.well.tops_misfit_m).forEach(([s, v]) => rows.push([`${s} misfit`, `${v} m`]));
  }
  if (d.surface && d.surface.tvd_at_column !== undefined) rows.push(["TVD here", `${d.surface.tvd_at_column} m`]);
  if (d.finding) rows.push([d.finding.status, d.finding.detail]);
  const acts = [];
  if (anchor && anchor.cell) {
    acts.push(`<button class="link" data-a="sx">Section along x here</button>`, `<button class="link" data-a="sy">Section along y here</button>`);
    if (S.spec.fig !== "layer_map") acts.push(`<button class="link" data-a="map">Layer ${anchor.cell[2]} map</button>`);
  }
  if (anchor && anchor.well && S.spec.fig !== "well") acts.push(`<button class="link" data-a="well">Well ${esc(anchor.well)} track</button>`);
  if (Object.keys(S.anchor).length) acts.push(`<button class="link" data-a="clear">Clear (general comment)</button>`);
  $("sel").innerHTML = `<div class="lbl">On: ${esc(label || "general")}</div>` +
    (rows.length ? `<table>${rows.slice(0, 14).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>` : "") +
    (view && view.fig ? `<div class="msg">View: ${esc(view.fig)}${view.kw ? " " + esc(view.kw) : ""}${view.layer ? " layer " + view.layer : ""}</div>` : "") +
    (acts.length ? `<div class="acts">${acts.join("")}</div>` : "");
  $("sel").querySelectorAll("button").forEach(b => b.onclick = () => {
    const a = S.anchor, kw = a.kw || S.spec.kw || "PORO";
    if (b.dataset.a === "sx" || b.dataset.a === "sy")
      openTab("section", { fig: "section", kw, along: b.dataset.a === "sx" ? "x" : "y", cell: a.cell.slice(0, 2) });
    if (b.dataset.a === "map") openTab("layer_map", { fig: "layer_map", kw, layer: a.cell[2] });
    if (b.dataset.a === "well") openTab("well", { fig: "well", well: a.well });
    if (b.dataset.a === "clear") select({}, "general", null, null);
  });
}

function selectGeneric(anchor, label, describe, view) {
  S.anchor = anchor || {};
  S.viewForComment = view;
  const a = S.anchor, acts = [];
  if (S.meta.kind === "res") {
    if (a.cell) acts.push(`<button class="link" data-g='${JSON.stringify({ fig: "contact_section", kw: a.kw || "SATNUM", along: "x", index: a.cell[1] })}'>Contact section through row ${a.cell[1]}</button>`,
                         `<button class="link" data-g='${JSON.stringify({ fig: "regions", kw: a.kw || "SATNUM", layer: a.cell[2] })}'>Layer ${a.cell[2]} map</button>`);
    if (a.satnum && S.spec.fig !== "kr") acts.push(`<button class="link" data-g='${JSON.stringify({ fig: "kr", satnum: a.satnum })}'>SATNUM ${a.satnum} curves</button>`);
    if (a.eqlnum && S.spec.fig !== "contacts") acts.push(`<button class="link" data-g='${JSON.stringify({ fig: "contacts" })}'>Contacts</button>`);
  }
  if (S.meta.kind === "well" && a.well) {
    if (S.spec.fig !== "well_section") acts.push(`<button class="link" data-g='${JSON.stringify({ fig: "well_section", well: a.well })}'>${esc(a.well)} path</button>`);
    if (S.spec.fig !== "history" && S.meta.views.includes("history")) acts.push(`<button class="link" data-g='${JSON.stringify({ fig: "history", well: a.well })}'>${esc(a.well)} history</button>`);
  }
  if (Object.keys(a).length) acts.push(`<button class="link" data-a="clear">Clear (general comment)</button>`);
  const rows = flatRows(describe);
  $("sel").innerHTML = `<div class="lbl">On: ${esc(label || "general")}</div>` +
    (rows.length ? `<table>${rows.slice(0, 16).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>` : "") +
    (view && view.fig ? `<div class="msg">View: ${esc(view.fig)}${view.well ? " " + esc(view.well) : ""}${view.kw ? " " + esc(view.kw) : ""}${view.layer ? " layer " + view.layer : ""}</div>` : "") +
    (acts.length ? `<div class="acts">${acts.join("")}</div>` : "");
  $("sel").querySelectorAll("button[data-g]").forEach(b => b.onclick = () => { const v = JSON.parse(b.dataset.g); openTab(v.fig, v); });
  $("sel").querySelectorAll("button[data-a=clear]").forEach(b => b.onclick = () => select({}, "general", null, null));
}

// ---------------------------------------------------------------- the QC report tab and the review steps
function findings() {
  const fs = S.meta.findings, src = `/qc?version_id=${S.vid}`;
  S.qcSeen.add(S.vid);
  $("findings").innerHTML = fs.length ? fs.map((f, n) => `<li data-n="${n}"><span class="badge ${esc(f.status)}">${esc(f.status)}</span>
    <b>${esc(f.area)}</b>: ${esc(f.check)} <span class="msg">${esc(f.detail)}</span></li>`).join("") : "<li>No QC findings recorded.</li>";
  const fr = $("qcframe");
  if (S.meta.qc_report) {
    $("qcnote").innerHTML = `Click a finding to pin a comment on it. The full report is below
      (<a href="${src}" target="_blank" rel="noopener">open it in its own tab</a>).`;
    fr.style.display = "block";
    if (fr.getAttribute("src") !== src) fr.setAttribute("src", src);
  } else {
    $("qcnote").textContent = "This version has no QC report file.";
    fr.style.display = "none";
  }
  renderSteps();
  whatChanged();
  $("findings").querySelectorAll("li[data-n]").forEach(li => li.onclick = () => {
    const f = fs[+li.dataset.n];
    select({ finding: `${f.area}: ${f.check}` }, `finding ${f.area}: ${f.check}`, { finding: f }, null);
  });
}

// the version chain: each version says where it came from; a version built while the page is open is offered
const vOrigin = v => v.from_proposal ? `from proposal #${v.from_proposal} on v${v.base_version}`
                   : v.addresses.length ? `answers #${v.addresses.join(", #")}` : v.version === 1 ? "first build" : "rebuilt";
function renderVersions(vs) {
  S.meta.versions = vs;
  const sel = $("version");
  const html = vs.map(v => `<option value="${v.version_id}" ${v.version_id === S.vid ? "selected" : ""}>v${v.version} · ${esc(vOrigin(v))} (${esc(v.status)})</option>`).join("");
  if (sel.dataset.sig !== html) { sel.innerHTML = html; sel.dataset.sig = html; }
  if (!S.knownV) { S.knownV = new Set(vs.map(v => v.version_id)); S.dismissedV = new Set(); }
  const fresh = vs.filter(v => !S.knownV.has(v.version_id) && !S.dismissedV.has(v.version_id));
  const el = $("newver");
  if (!fresh.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  const v = fresh[fresh.length - 1];
  const sig = `${v.version_id}:${v.status}`;
  if (el.dataset.sig === sig && el.style.display === "block") return;
  el.dataset.sig = sig;
  el.style.display = "block";
  el.innerHTML = `<b>v${v.version} is here</b> (${esc(vOrigin(v))}, ${esc(v.status)}).
    <button class="primary" id="nvopen">Open v${v.version}</button> <button class="link" id="nvlater">Later</button>
    <span class="msg">It opens on its QC report, with what changed on top.</span>`;
  $("nvopen").onclick = () => { location.search = `?version_id=${v.version_id}`; };
  $("nvlater").onclick = () => { fresh.forEach(x => S.dismissedV.add(x.version_id)); renderVersions(S.meta.versions); };
}

// on the QC report tab of a later version: what changed from the version it was built on
async function whatChanged() {
  const el = $("qcchange"), me = (S.meta.versions || []).find(v => v.version_id === S.vid);
  if (!me || (me.version === 1 && !me.from_proposal)) { el.innerHTML = ""; return; }
  if (!S.change || S.change.version_id !== S.vid) {
    try { S.change = (await api(`/api/diff?version_id=${S.vid}`)).diff; }
    catch (e) { el.innerHTML = `<span class="msg err">${esc(e.message)}</span>`; return; }
  }
  const d = S.change;
  if (!d.base_version_id) { el.innerHTML = ""; return; }
  const f = d.findings, js = v => esc(JSON.stringify(v));
  const spec = d.spec.slice(0, 8).map(c => `<tr><td>${esc(c.key)}</td><td>${js(c.old)} &rarr; <b>${js(c.new)}</b></td></tr>`).join("");
  el.innerHTML = `<b>What changed from v${d.base_version}</b>
    ${d.proposals.map(p => `<div class="msg">Built from proposal #${p.id}: ${esc(p.rationale)}</div>`).join("")}
    ${d.spec.length ? `<table>${spec}</table>${d.spec.length > 8 ? `<div class="msg">and ${d.spec.length - 8} more</div>` : ""}` : `<div class="msg">Same spec.</div>`}
    <div>QC findings: ${f.fixed.length} fixed · ${f.still.length} still there · ${f.new.length} new</div>
    ${d.threads.length ? `<div class="msg">Answers ${d.threads.map(t => `<button class="link" data-c="${t.id}">#${t.id}</button>`).join(" ")}</div>` : ""}
    <div class="acts"><button class="link" id="qcdiff">See the diff</button></div>`;
  $("qcdiff").onclick = () => loadDiff(d.base_version_id);
  el.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => highlight(+b.dataset.c));
}

// 1 QC report · 2 Discuss · 3 Decide: where this version stands, and the step to go to next
function renderSteps() {
  const m = S.meta;
  if (!m) return;
  const dec = m.decision || {}, ses = S.session || {}, st = m.status;
  const c = { pass: 0, warn: 0, fail: 0 };
  m.findings.forEach(f => { if (f.status in c) c[f.status]++; });
  const qc = !m.qc_report ? ["no report for this version", ""]
           : m.findings.length ? [`${c.fail} fail, ${c.warn} warn, ${c.pass} pass`, c.fail ? "block" : c.warn ? "you" : ""]
           : ["read it first", ""];
  const blockers = (dec.blockers || []).length, open = blockers + (dec.open_other || []).length;
  const you = ses.waiting_on_you || 0, agent = ses.waiting_on_agent || 0;
  const talk = you ? [`${you} waiting on you`, "you"] : agent ? [`${agent} waiting on the ${m.kind} agent`, ""]
             : open ? [`${open} open on this version`, ""] : ["no open comments", ""];
  const decided = st === "approved" || st === "rejected";
  const decide = decided ? [st, ""] : st !== "qc_ready" ? [`${st}: not submitted for review`, ""]
               : blockers ? [`blocked by ${blockers} change comment${blockers > 1 ? "s" : ""}`, "block"]
               : [dec.can_decide ? "ready: approve or reject" : "ready: decide in your terminal", ""];
  // the step to be on: the report first, then the conversation while anything is open, then the decision
  const now = decided ? 4 : !S.qcSeen.has(S.vid) ? 1 : (st !== "qc_ready" || blockers || you || agent) ? 2 : 3;
  const steps = [["QC report", qc], ["Discuss", talk], ["Decide", decide]];
  $("steps").innerHTML = steps.map(([t, [s, cls]], i) => {
    const n = i + 1, state = n < now ? "done" : n === now ? "now" : "";
    return `<button data-step="${n}" class="${state}"><span class="n">${n < now ? "&#10003;" : n}</span>
      <span><span class="t">${t}</span><br><span class="s ${cls}">${esc(s)}</span></span></button>`;
  }).join("");
  $("steps").querySelectorAll("button").forEach(b => b.onclick = () => {
    const n = +b.dataset.step;
    if (n === 1) return openTab("findings");
    if (n === 2) { $("comments").scrollIntoView({ behavior: "smooth", block: "start" }); $("text").focus({ preventScroll: true }); return; }
    ($("decide").style.display === "block" ? $("decide") : $("cmds")).scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

// ---------------------------------------------------------------- what-if (previews and the engineer's own changes)
// res knobs: contacts per EQLNUM, Corey parameters per SATNUM (measured tables have none), rock compressibility
const COREY = { swc: 0.2, sorw: 0.2, nw: 2, now: 2, krw_max: 0.4 };
const asList = v => v === undefined || v === null ? [] : Array.isArray(v) ? v : [v];
function resKnobDefaults() {
  const sp = S.meta.spec || {};
  const contacts = asList(sp.contacts).map((c, n) => ({ eqlnum: c.eqlnum ?? n + 1, datum_pressure: c.datum_pressure,
                                                        owc_depth: c.owc_depth ?? null, goc_depth: c.goc_depth ?? null }));
  const scal = asList(sp.scal).map((t, n) => ({ satnum: t.satnum ?? n + 1, measured: !!(t.swof || t.sgof),
    ...Object.fromEntries(Object.keys(COREY).map(k => [k, t[k] ?? COREY[k]])) }));
  const rock = asList(sp.rock);
  return { contacts, scal, cr: rock.length ? rock[0].cr : 4.5e-5 };
}
function resKnobPatch(k) {
  const d = resKnobDefaults(), sp = S.meta.spec || {}, patch = {};
  const changedC = k.contacts.some((c, i) => ["datum_pressure", "owc_depth", "goc_depth"].some(f => c[f] !== d.contacts[i][f]));
  if (changedC) {
    if (Array.isArray(sp.contacts)) patch.contacts = sp.contacts.map((c, i) => ({ ...c, ...Object.fromEntries(
      ["datum_pressure", "owc_depth", "goc_depth"].filter(f => k.contacts[i][f] !== d.contacts[i][f]).map(f => [f, k.contacts[i][f]])) }));
    else { patch.contacts = {}; ["datum_pressure", "owc_depth", "goc_depth"].forEach(f => { if (k.contacts[0][f] !== d.contacts[0][f]) patch.contacts[f] = k.contacts[0][f]; }); }
  }
  const changedS = k.scal.some((t, i) => !t.measured && Object.keys(COREY).some(f => t[f] !== d.scal[i][f]));
  if (changedS) {
    if (Array.isArray(sp.scal)) patch.scal = sp.scal.map((t, i) => k.scal[i].measured ? t :
      { ...t, ...Object.fromEntries(Object.keys(COREY).filter(f => k.scal[i][f] !== d.scal[i][f]).map(f => [f, k.scal[i][f]])) });
    else { patch.scal = {}; Object.keys(COREY).forEach(f => { if (k.scal[0][f] !== d.scal[0][f]) patch.scal[f] = k.scal[0][f]; }); }
  }
  if (k.cr !== d.cr) patch.rock = Array.isArray(sp.rock) ? sp.rock.map(r => ({ ...r, cr: k.cr })) : { cr: k.cr };
  return patch;
}
function resWhatifControls() {
  const el = $("controls"), d = resKnobDefaults();
  S.knobs = S.knobs || resKnobDefaults();
  const k = S.knobs;
  const num = (id, v, step, ref) => `<input type="number" id="${id}" step="${step}" value="${v ?? ""}" placeholder="none" class="${v !== ref ? "changed" : ""}">`;
  let h = `<div class="knobs">${k.contacts.map((c, i) => `<span><b>EQLNUM ${c.eqlnum}</b>
      <label>datum p ${num(`kc_${i}_datum_pressure`, c.datum_pressure, 1, d.contacts[i].datum_pressure)}</label>
      <label>OWC ${num(`kc_${i}_owc_depth`, c.owc_depth, 1, d.contacts[i].owc_depth)}</label>
      <label>GOC ${num(`kc_${i}_goc_depth`, c.goc_depth, 1, d.contacts[i].goc_depth)}</label></span>`).join("")}</div>
    <div class="knobs" style="margin-top:6px">${k.scal.map((t, i) => t.measured ? `<span class="msg">SATNUM ${t.satnum}: measured tables</span>` :
      `<span><b>SATNUM ${t.satnum}</b>${Object.keys(COREY).map(f => `<label>${f} ${num(`ks_${i}_${f}`, t[f], f.startsWith("n") ? 0.1 : 0.01, d.scal[i][f])}</label>`).join("")}</span>`).join("")}</div>
    <div class="knobs" style="margin-top:6px"><label>rock cr ${num("kr_cr", k.cr, 1e-6, d.cr)}</label>
      <button class="primary" id="runpreview">Preview</button> <button class="link" id="resetknobs">reset</button>
      <span class="msg" id="pmsg"></span></div>`;
  const p = S.preview;
  if (p) h += `<div class="knobs" style="margin-top:6px"><label>Show <select id="pshow">${[["kr", "rel perm vs v" + p.base_version], ["contacts", "contacts vs v" + p.base_version], ["contact_section", "contact section"]].filter(([f]) => S.meta.views.includes(f)).map(([f, n]) => `<option value="${f}" ${S.spec.fig === f ? "selected" : ""}>${n}</option>`).join("")}</select></label></div>`;
  el.innerHTML = h;
  el.querySelectorAll("input[id^=kc_], input[id^=ks_], #kr_cr").forEach(inp => inp.onchange = () => {
    const v = inp.value === "" ? null : +inp.value;
    if (inp.id === "kr_cr") k.cr = v;
    else { const [g, i, ...f] = inp.id.split("_"); (g === "kc" ? k.contacts : k.scal)[+i][f.join("_")] = v; }
    resWhatifControls();
  });
  $("runpreview").onclick = runPreview;
  $("resetknobs").onclick = () => { S.knobs = resKnobDefaults(); resWhatifControls(); };
  const ps = $("pshow"); if (ps) ps.onchange = e => { previewSpec(e.target.value); draw(); };
}

function knobDefaults() {
  if (!GEO()) return resKnobDefaults();
  const sp = S.meta.spec || {}, pp = sp.petro || {};
  return { vsh_cutoff: pp.vsh_cutoff ?? 0.5, kv_kh: pp.kv_kh ?? 0.1, pp_a: (pp.poro_perm || [0.01, 30])[0],
           pp_b: (pp.poro_perm || [0.01, 30])[1], min_thickness: sp.min_thickness ?? 0.5, layers: [...(sp.layers || [])] };
}

function knobPatch(k) {
  if (!GEO()) return resKnobPatch(k);
  const d = knobDefaults(), petro = {}, patch = {};
  if (+k.vsh_cutoff !== d.vsh_cutoff) petro.vsh_cutoff = +k.vsh_cutoff;
  if (+k.kv_kh !== d.kv_kh) petro.kv_kh = +k.kv_kh;
  if (+k.pp_a !== d.pp_a || +k.pp_b !== d.pp_b) petro.poro_perm = [+k.pp_a, +k.pp_b];
  if (Object.keys(petro).length) patch.petro = petro;
  if (+k.min_thickness !== d.min_thickness) patch.min_thickness = +k.min_thickness;
  if (k.layers.some((n, i) => +n !== d.layers[i])) patch.layers = k.layers.map(Number);
  return patch;
}

function whatifControls() {
  if (!GEO()) return resWhatifControls();
  const el = $("controls"), d = knobDefaults();
  S.knobs = S.knobs || knobDefaults();
  const k = S.knobs, zones = S.meta.zones || [];
  const num = (id, v, step, ref) => `<input type="number" id="k_${id}" step="${step}" value="${v}" class="${+v !== ref ? "changed" : ""}">`;
  let h = `<div class="knobs">
    <label>Vsh cut-off ${num("vsh_cutoff", k.vsh_cutoff, 0.05, d.vsh_cutoff)}</label>
    <label>kv/kh ${num("kv_kh", k.kv_kh, 0.01, d.kv_kh)}</label>
    <label title="k = a·10^(b·φ), used only where no permeability is logged">poro-perm a ${num("pp_a", k.pp_a, 0.001, d.pp_a)} b ${num("pp_b", k.pp_b, 1, d.pp_b)}</label>
    <label>min thickness ${num("min_thickness", k.min_thickness, 0.1, d.min_thickness)}</label>
    ${zones.map((z, i) => `<label>${esc(z.zone)} layers ${num("layers_" + i, k.layers[i], 1, d.layers[i])}</label>`).join("")}
    <button class="primary" id="runpreview">Preview</button> <button class="link" id="resetknobs">reset</button>
    <span class="msg" id="pmsg"></span></div>`;
  const p = S.preview;
  if (p) {
    const s = S.spec;
    h += `<div class="knobs" style="margin-top:6px">
      <label>Show <select id="pshow"><option value="diff" ${s.fig === "diff_map" ? "selected" : ""}>difference from v${p.base_version}</option>
        <option value="map" ${s.fig === "layer_map" ? "selected" : ""}>preview map</option></select></label>
      <label>Property <select id="pkw">${S.meta.keywords.map(x => `<option ${x === s.kw ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      ${s.fig === "layer_map" || p.maps === "layer" ? `<label>Layer <input type="number" id="player" min="1" max="${+p.grid.split(" x ")[2]}" value="${s.layer || 1}"></label>` :
        `<label>Zone <select id="pzone">${zones.map(z => `<option ${z.zone === s.zone ? "selected" : ""}>${esc(z.zone)}</option>`).join("")}</select></label>`}
    </div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll(".knobs input[id^=k_]").forEach(inp => inp.onchange = () => {
    const key = inp.id.slice(2);
    if (key.startsWith("layers_")) k.layers[+key.slice(7)] = +inp.value; else k[key] = +inp.value;
    whatifControls();
  });
  $("runpreview").onclick = runPreview;
  $("resetknobs").onclick = () => { S.knobs = knobDefaults(); whatifControls(); };
  const on = (id, fn) => { const x = $(id); if (x) x.onchange = fn; };
  on("pshow", e => { previewSpec(e.target.value); draw(); });
  on("pkw", e => { S.spec.kw = e.target.value; delete S.spec.log; draw(); });
  on("player", e => { S.spec.layer = +e.target.value; delete S.spec.zone; draw(); });
  on("pzone", e => { S.spec.zone = e.target.value; delete S.spec.layer; draw(); });
}

function previewSpec(show) {
  const p = S.preview, kw = S.spec.kw || "PORO";
  if (!GEO()) {
    const f = ["kr", "contacts", "contact_section"].includes(show) ? show
      : (p.changes || []).some(c => c.key.startsWith("contacts")) && S.meta.views.includes("contacts") ? "contacts" : "kr";
    S.spec = f === "contact_section" ? { fig: f, preview_id: p.preview_id, kw: S.meta.keywords.includes("EQLNUM") ? "EQLNUM" : S.meta.keywords[0] }
                                     : { fig: f, preview_id: p.preview_id, base_version_id: p.base_version_id };
    return;
  }
  if (show === "map") S.spec = { fig: "layer_map", preview_id: p.preview_id, kw, layer: S.spec.layer || 1 };
  else if (p.maps) {
    S.spec = { fig: "diff_map", preview_id: p.preview_id, base_version_id: p.base_version_id, kw };
    if (p.maps === "layer") S.spec.layer = S.spec.layer || 1; else S.spec.zone = (S.meta.zones[0] || {}).zone;
  } else S.spec = { fig: "layer_map", preview_id: p.preview_id, kw, layer: 1 };
}

async function runPreview() {
  const patch = knobPatch(S.knobs);
  if (!Object.keys(patch).length) { $("pmsg").textContent = "Change a setting first."; return; }
  $("pmsg").textContent = "Building the preview…";
  $("runpreview").disabled = true;
  try {
    const r = await api("/api/previews", { base_version_id: S.vid, spec_patch: patch });
    showPreview(r.preview);
  } catch (e) { $("pmsg").className = "msg err"; $("pmsg").textContent = e.message; $("runpreview").disabled = false; }
}

function showPreview(p) {
  S.preview = p;
  previewSpec("diff");
  S.tab = "whatif";
  tabs();
  $("qcpane").style.display = "none"; $("plot").style.display = "block"; $("diffinfo").style.display = "block";
  renderPreviewInfo();
  draw();
}

function renderPreviewInfo() {
  const p = S.preview, el = $("diffinfo");
  if (S.tab !== "whatif") return;
  if (!p) { el.innerHTML = ""; return; }
  const fmt = v => v === null || v === undefined ? "–" : typeof v === "number" ? (Math.abs(v) >= 1e5 ? v.toExponential(3) : +v.toPrecision(5)) : esc(v);
  const ch = v => v === null || v === undefined ? "" : v === 0 ? "0" : (v > 0 ? "+" : "") + fmt(v);
  const f = p.findings, moved = p.numbers.filter(n => n.change !== null && n.change !== 0);
  const open = S.comments.filter(c => c.status === "open");
  el.innerHTML = `<h3>Preview #${p.preview_id} on v${p.base_version} · ${esc(p.grid)} · built in ${p.elapsed_s} s · not a version</h3>
    <table>${p.changes.map(c => `<tr><td>${esc(c.key)}</td><td>${esc(JSON.stringify(c.old))}</td><td>→ <b>${esc(JSON.stringify(c.new))}</b></td></tr>`).join("")}</table>
    <h3>QC findings</h3><div>fixed ${f.fixed.length} · still ${f.still.length} · new ${f.new.length}</div>
    ${[["fixed", "pass"], ["new", "fail"]].map(([k, cls]) => f[k].map(x => `<div><span class="badge ${cls}">${k}</span> ${esc(x.finding)} <span class="msg">${esc(x.detail || "")}</span></div>`).join("")).join("")}
    <h3>What changes (${moved.length} of ${p.numbers.length} numbers)</h3>
    <table><tr><th></th><th>v${p.base_version}</th><th>preview</th><th>change</th></tr>
    ${(moved.length ? moved : p.numbers).map(n => `<tr><td>${esc(n.key)}</td><td class="num">${fmt(n.old)}</td><td class="num">${fmt(n.new)}</td><td class="num">${ch(n.change)}</td></tr>`).join("")}</table>
    <h3>Ask the ${AGENT()} to build this</h3>
    <div class="msg">It becomes your proposal, accepted at once; the agent builds the new version from it and answers the comments.</div>
    ${open.length ? `<div>${open.map(c => `<label class="msg" style="display:block"><input type="checkbox" data-fb="${c.id}"> #${c.id} [${esc(c.label)}] ${esc(c.comment.slice(0, 80))}</label>`).join("")}</div>` : ""}
    <textarea id="prationale" placeholder="Why (with no comment ticked, this becomes a new comment)"></textarea>
    <div class="row"><button class="primary" id="prequest">Ask the agent to build this</button><span class="msg" id="preqmsg"></span></div>`;
  $("prequest").onclick = async () => {
    const ids = [...el.querySelectorAll("input[data-fb]:checked")].map(x => +x.dataset.fb);
    try {
      const r = await api("/api/requests", { preview_id: p.preview_id, feedback_ids: ids, rationale: $("prationale").value });
      $("preqmsg").textContent = `Proposal #${r.proposal.id} accepted: the ${AGENT()} builds it next.`;
      await loadComments(true);
    } catch (e) { $("preqmsg").className = "msg err"; $("preqmsg").textContent = e.message; }
  };
}

// ---------------------------------------------------------------- approve / reject (design decision 1)
function renderDecision(dec) {
  const el = $("decide");
  if (!dec || !dec.can_decide || dec.status !== "qc_ready") { el.style.display = "none"; el.innerHTML = ""; S.decSig = ""; return; }
  const sig = JSON.stringify(dec);
  if (sig === S.decSig) return;            // unchanged: keep what is being typed
  S.decSig = sig;
  const typed = ($("dconfirm") || {}).value || "", why = ($("dwhy") || {}).value || "";
  el.style.display = "block";
  el.innerHTML = `<h2 style="margin-top:0">Decision on ${esc(dec.confirm_text)}</h2>
    ${dec.blockers.length ? `<div class="block">Open change comment(s) ${dec.blockers.map(i => `<button class="link" data-c="${i}">#${i}</button>`).join(" ")}: answered first, or reject.</div>` : ""}
    ${dec.open_other.length ? `<div class="warnq">Still open (questions or notes): ${dec.open_other.map(i => `<button class="link" data-c="${i}">#${i}</button>`).join(" ")}</div>` : ""}
    <div class="msg">Decided on this version's <button class="link" id="dqc">QC report</button>.</div>
    <input id="dconfirm" placeholder="Type ${esc(dec.confirm_text)} to confirm" autocomplete="off" value="${esc(typed)}">
    <input id="dwhy" placeholder="Comment (needed to reject)" value="${esc(why)}">
    <div class="row"><button class="primary" id="dapprove">Approve</button><button class="danger" id="dreject">Reject</button>
    <span class="msg" id="dmsg"></span></div>`;
  const sync = () => {
    const ok = $("dconfirm").value.trim() === dec.confirm_text;
    $("dapprove").disabled = !ok || dec.blockers.length > 0;
    $("dreject").disabled = !ok || !$("dwhy").value.trim();
  };
  $("dconfirm").oninput = sync; $("dwhy").oninput = sync; sync();
  $("dqc").onclick = () => openTab("findings");
  el.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => highlight(+b.dataset.c));
  const go = async action => {
    try {
      const r = await api("/api/decide", { version_id: S.vid, action, confirm: $("dconfirm").value, comment: $("dwhy").value });
      $("dmsg").textContent = r.spoken_summary;
      S.decSig = "";
      await loadMeta(); tabs(); await loadComments(true);
    } catch (e) { $("dmsg").className = "msg err"; $("dmsg").textContent = e.message; }
  };
  $("dapprove").onclick = () => go("approve");
  $("dreject").onclick = () => go("reject");
}

async function loadComments(force) {
  const r = await api(`/api/comments?version_id=${S.vid}`);
  const sig = JSON.stringify([r.comments, r.proposals]);
  S.session = r.session;
  if (r.versions && S.meta) renderVersions(r.versions);
  renderSession();
  if (r.decision && S.meta) { S.meta.decision = r.decision; renderDecision(r.decision); }
  renderSteps();
  if (!force && sig === S.lastSig) return;
  const firstLoad = !S.lastSig;
  S.lastSig = sig;
  S.comments = r.comments;
  S.proposals = r.proposals;
  renderComments();
  if (!firstLoad && S.tab !== "findings") draw();      // new pins
}

function renderSession() {
  const s = S.session || {};
  const sig = JSON.stringify(s);
  if (sig === S.sessionSig) return;        // unchanged: keep the button under the pointer
  S.sessionSig = sig;
  if (S.meta && !S.meta.threads) {         // fluid: no live session; the modeler answers in its next version
    $("session").innerHTML = `<span class="msg">The ${esc(S.meta.kind)} modeler answers comments in its next version</span>`;
    return;
  }
  $("session").innerHTML = `<span class="dot ${s.listening ? "on" : ""}"></span>
    <span>${s.listening ? AGENT() + " listening" : AGENT() + " not listening"}</span>
    ${s.waiting_on_you ? `<span class="wait you">${s.waiting_on_you} waiting on you</span>` : ""}
    ${s.waiting_on_agent ? `<span class="wait agent">${s.waiting_on_agent} waiting on agent</span>` : ""}
    ${s.open ? `<button class="link" id="endsession">End session</button>` : ""}`;
  const b = $("endsession");
  if (b) b.onclick = async () => {
    try { await api("/api/session/end", { version_id: S.vid }); await loadComments(true); }
    catch (e) { alert(e.message); }
  };
}

function viewLabel(v) {
  return `${v.fig}${v.kw ? " " + v.kw : ""}${v.layer ? " layer " + v.layer : ""}${v.zone ? " zone " + v.zone : ""}${v.well ? " " + v.well : ""}${v.cell ? " cell " + v.cell.join(",") : ""}`;
}

function proposalCard(p) {
  if (!p) return "";
  const rows = p.changes.map(c => `<tr><td>${esc(c.key)}</td><td>${esc(JSON.stringify(c.old))}</td><td>→</td><td><b>${esc(JSON.stringify(c.new))}</b></td></tr>`).join("");
  let acts = "";
  if (p.status === "proposed")
    acts = `<div class="acts"><button class="primary" data-acc="${p.id}">Accept</button>
      <input placeholder="why not (to reject)" id="rej${p.id}"><button data-rej="${p.id}">Reject</button></div>`;
  else acts = `<div class="msg">${p.status === "built" ? "accepted" : esc(p.status)}${p.reviewer ? " by " + esc(p.reviewer) : ""}${p.built_version ? ` · built v${p.built_version}` : ""}${p.comment ? ": " + esc(p.comment) : ""}</div>`;
  const pv = p.preview;
  const pvh = pv ? `<div class="msg">Previewed (#${pv.preview_id}, ${esc(pv.grid)}): findings fixed ${pv.findings.fixed.length}, new ${pv.findings.new.length}
    · <button class="link" data-pv="${p.id}">show the preview</button></div>` : "";
  return `<div class="prop"><b>Proposal #${p.id}</b> by ${p.author_role === "reviewer" ? "you" : "the " + AGENT()} on v${p.base_version}<table>${rows}</table>${pvh}
    ${p.expected ? `<div class="msg">Expected: ${esc(typeof p.expected === "string" ? p.expected : JSON.stringify(p.expected))}</div>` : ""}
    ${p.built_version_id ? `<button class="link" data-diff="${p.built_version_id}" data-base="${p.base_version_id}">diff v${p.built_version} vs v${p.base_version}</button>` : ""}${acts}</div>`;
}

function renderComments() {
  // keep what is being typed
  document.querySelectorAll("textarea[data-draft]").forEach(t => S.drafts[t.dataset.draft] = t.value);
  const onlyV = $("onlyv").checked, onlyO = $("onlyopen").checked, onlyMe = $("onlyme").checked;
  const cs = S.comments.filter(c => (!onlyV || c.version_id === S.vid) && (!onlyO || c.status === "open")
                                 && (!onlyMe || c.waiting_on === "reviewer")).reverse();
  const shownProps = new Set();
  $("comments").innerHTML = cs.length ? cs.map(c => {
    const msgs = (c.messages || []).map(m => {
      let card = "";
      if (m.proposal_id && m.kind === "proposal" && !shownProps.has(m.proposal_id)) {
        shownProps.add(m.proposal_id);
        card = proposalCard(S.proposals[m.proposal_id]);
      }
      return `<div class="m ${esc(m.author_role)}"><div class="who"><b>${esc(m.author)}</b> <span class="kind">${esc(m.kind)}</span> ${esc(m.created_at)}</div>
        <div class="txt">${esc(m.body)}</div>
        ${(m.views || []).map((v, n) => `<button class="link" data-mv="${m.id}:${n}">open view: ${esc(viewLabel(v))}</button>`).join(" ")}
        ${m.version_id && m.kind !== "message" ? ` <button class="link" data-goto="${m.version_id}">open that version</button>` : ""}
        ${card}</div>`;
    }).join("");
    const w = c.waiting_on === "reviewer" ? `<span class="wait you">waiting on you</span>` :
              c.waiting_on === "modeler" ? `<span class="wait agent">waiting on agent</span>` : "";
    const open = S.replyOpen.has(c.id);
    return `<div class="c" id="c${c.id}">
    <div class="top"><b>#${c.id}</b> v${c.version} · ${esc(c.severity)} · <span class="st-${esc(c.status)}">${esc(c.status)}</span>
      ${w} · ${esc(c.label)} · ${esc(c.reviewer)} · ${esc(c.created_at)}
      ${c.view ? `<button class="link" data-v="${c.id}">show view</button>` : ""}</div>
    <div class="body">${esc(c.comment)}</div>
    ${msgs}
    ${open ? `<div class="reply"><textarea data-draft="${c.id}" placeholder="${c.status === "open" ? "Reply" : "Writing here reopens it"}">${esc(S.drafts[c.id] || "")}</textarea>
      <div class="row"><button class="primary" data-send="${c.id}">Send</button><button data-cancel="${c.id}">Cancel</button>
      ${S.viewForComment ? `<label class="msg"><input type="checkbox" data-withview="${c.id}"> with current view</label>` : ""}</div></div>`
           : S.meta.threads ? `<button class="link" data-open="${c.id}">${c.status === "open" ? "Reply" : "Reopen"}</button>` : ""}
  </div>`;
  }).join("") : `<div class="msg">No comments yet.</div>`;
  const q = sel => $("comments").querySelectorAll(sel);
  q("button[data-v]").forEach(b => b.onclick = () => showView(+b.dataset.v));
  q("button[data-open]").forEach(b => b.onclick = () => { S.replyOpen.add(+b.dataset.open); renderComments(); });
  q("button[data-cancel]").forEach(b => b.onclick = () => { S.replyOpen.delete(+b.dataset.cancel); delete S.drafts[b.dataset.cancel]; renderComments(); });
  q("button[data-send]").forEach(b => b.onclick = () => sendReply(+b.dataset.send));
  q("button[data-goto]").forEach(b => b.onclick = () => { location.search = `?version_id=${b.dataset.goto}`; });
  q("button[data-diff]").forEach(b => b.onclick = () => { location.search = `?version_id=${b.dataset.diff}&diff=${b.dataset.base}`; });
  q("button[data-mv]").forEach(b => b.onclick = () => {
    const [mid, n] = b.dataset.mv.split(":").map(Number);
    const m = S.comments.flatMap(c => c.messages || []).find(m => m.id === mid);
    if (m) openViewSpec(m.views[n]);
  });
  q("button[data-acc]").forEach(b => b.onclick = () => decide(+b.dataset.acc, "accept"));
  q("button[data-pv]").forEach(b => b.onclick = () => {
    const p = S.proposals[b.dataset.pv];
    if (p.base_version_id !== S.vid) { location.search = `?version_id=${p.base_version_id}`; return; }
    showPreview(p.preview);
  });
  q("button[data-rej]").forEach(b => b.onclick = () => decide(+b.dataset.rej, "reject", $(`rej${b.dataset.rej}`).value));
}

async function sendReply(id) {
  const t = document.querySelector(`textarea[data-draft="${id}"]`);
  const body = (t ? t.value : "").trim();
  if (!body) return;
  const wv = document.querySelector(`input[data-withview="${id}"]`);
  try {
    await api("/api/messages", { feedback_id: id, body, views: wv && wv.checked && S.viewForComment ? [{ ...S.viewForComment, version_id: S.vid }] : null });
    S.replyOpen.delete(id); delete S.drafts[id];
    await loadComments(true);
  } catch (e) { alert(e.message); }
}

async function decide(pid, action, comment) {
  if (action === "accept" && !confirm(`Accept proposal #${pid}? The ${AGENT()} will build a new version from it.`)) return;
  try { await api("/api/proposals/decide", { proposal_id: pid, action, comment: comment || null }); await loadComments(true); }
  catch (e) { alert(e.message); }
}

async function openViewSpec(v) {
  if (!v) return;
  if (v.preview_id) {
    try {
      const r = await api(`/api/preview?id=${v.preview_id}`);
      if (r.removed) { alert(`Preview #${v.preview_id}'s grid was removed (its summary is kept).`); return; }
      if (r.preview.base_version_id !== S.vid) { location.search = `?version_id=${r.preview.base_version_id}&view=${encodeURIComponent(JSON.stringify(v))}`; return; }
      showPreview(r.preview);
      S.spec = { ...v };
      draw();
    } catch (e) { alert(e.message); }
    return;
  }
  if (v.version_id && v.version_id !== S.vid) {
    location.search = `?version_id=${v.version_id}&view=${encodeURIComponent(JSON.stringify(v))}`;
    return;
  }
  if (v.fig === "diff_map") { S.diff = null; loadDiff(v.base_version_id, v); return; }
  openTab(v.fig, v);
}

function showView(id) {
  const c = S.comments.find(c => c.id === id);
  if (!c || !c.view) return;
  highlight(id);
  openViewSpec({ ...c.view, version_id: c.version_id });
}

function highlight(id) {
  document.querySelectorAll(".c.hl").forEach(e => e.classList.remove("hl"));
  const el = $(`c${id}`);
  if (el) { el.classList.add("hl"); el.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
}

async function loadDiff(base, spec) {
  try {
    const r = await api(`/api/diff?version_id=${S.vid}${base ? "&base=" + base : ""}`);
    S.diff = r.diff;
  } catch (e) { $("hint").textContent = e.message; $("hint").className = "msg err"; return; }
  const d = S.diff;
  renderDiffInfo();
  if (!GEO()) {                 // res and well: the numbers; res also its curves or contacts over the base's
    S.tab = "diff"; tabs();
    $("qcpane").style.display = "none"; $("plot").style.display = "block"; $("diffinfo").style.display = "block";
    const contacts = (d.spec || []).some(c => c.key.startsWith("contacts")) && S.meta.views.includes("contacts");
    S.spec = S.meta.kind === "res" && d.base_version_id ? (spec || { fig: contacts ? "contacts" : "kr", base_version_id: d.base_version_id }) : {};
    draw();
    return;
  }
  const kw = (spec && spec.kw) || ((d.keywords || []).includes("PORO") ? "PORO" : (d.keywords || [])[0]);
  const s = spec ? { ...spec } : { fig: "diff_map", kw, base_version_id: d.base_version_id };
  s.base_version_id = d.base_version_id;
  if (d.maps === "layer" && !s.layer && !s.zone) s.layer = 1;
  if (d.maps === "zone") { delete s.layer; s.zone = s.zone || d.zones[0]; }
  openTab("diff_map", s);
}

function renderDiffInfo() {
  const d = S.diff, el = $("diffinfo");
  if (!d || !d.base_version_id) { el.innerHTML = ""; return; }
  const fmt = v => v === null || v === undefined ? "–" : typeof v === "number" ? (Math.abs(v) >= 1e5 ? v.toExponential(3) : +v.toPrecision(5)) : esc(v);
  const ch = v => v === null || v === undefined ? "" : (v > 0 ? "+" : "") + fmt(v);
  const f = d.findings;
  el.innerHTML = `<h3>v${d.version} against v${d.base_version} · maps compared ${d.maps ? "by " + d.maps : "not at all (different areal grid)"}</h3>
    ${d.proposals.map(p => `<div class="msg">Built from proposal #${p.id}: ${esc(p.rationale)}</div>`).join("")}
    <h3>Spec</h3>${d.spec.length ? `<table>${d.spec.map(c => `<tr><td>${esc(c.key)}</td><td>${esc(JSON.stringify(c.old))}</td><td>${esc(JSON.stringify(c.new))}</td></tr>`).join("")}</table>` : `<div class="msg">Same spec.</div>`}
    <h3>QC findings</h3><div>fixed ${f.fixed.length} · still ${f.still.length} · new ${f.new.length}</div>
    ${[["fixed", "pass"], ["still", "warn"], ["new", "fail"]].map(([k, cls]) => f[k].map(x => `<div><span class="badge ${cls}">${k}</span> ${esc(x.finding)} <span class="msg">${esc(x.detail || "")}</span></div>`).join("")).join("")}
    <h3>Numbers</h3><table><tr><th></th><th>v${d.base_version}</th><th>v${d.version}</th><th>change</th></tr>
    ${d.numbers.map(n => `<tr><td>${esc(n.key)}</td><td class="num">${fmt(n.old)}</td><td class="num">${fmt(n.new)}</td><td class="num">${ch(n.change)}</td></tr>`).join("")}</table>
    ${d.threads.length ? `<h3>Comments this version answers</h3>${d.threads.map(t => `<div>#${t.id} [${esc(t.label)}] ${esc(t.comment)}
      ${t.view ? `<button class="link" data-dv="${t.id}:new">view on v${d.version}</button> <button class="link" data-dv="${t.id}:old">on v${d.base_version}</button>` : ""}</div>`).join("")}` : ""}`;
  el.querySelectorAll("button[data-dv]").forEach(b => b.onclick = () => {
    const [id, which] = b.dataset.dv.split(":");
    const t = d.threads.find(t => t.id === +id);
    const v = { ...t.view };
    delete v.version_id;
    if (v.fig === "layer_map" && v.layer > S.meta.grid[2]) v.layer = S.meta.grid[2];
    openViewSpec({ ...v, version_id: which === "new" ? d.version_id : d.base_version_id });
  });
}

$("post").onclick = async () => {
  const text = $("text").value.trim();
  $("postmsg").className = "msg";
  if (!text) { $("postmsg").textContent = "Write the comment first."; return; }
  if (!token) { $("postmsg").className = "msg err"; $("postmsg").textContent = "No review token: open the URL printed by opmagent geo review."; return; }
  try {
    const r = await api("/api/comments", { version_id: S.vid, comment: text, severity: $("severity").value,
                                           anchor: S.anchor, view: S.viewForComment ? { ...S.viewForComment, version_id: S.vid } : null });
    $("text").value = "";
    $("postmsg").textContent = `Comment #${r.feedback.id} added.`;
    await loadComments(true);
    if (S.tab !== "findings") draw();
  } catch (e) { $("postmsg").className = "msg err"; $("postmsg").textContent = e.message; }
};
$("onlyv").onchange = renderComments;
$("onlyopen").onchange = renderComments;
$("onlyme").onchange = renderComments;
$("version").onchange = e => { location.search = `?version_id=${e.target.value}`; };

(async () => {
  try {
    await loadMeta();
    tabs();
    select({}, "general", null, null);
    let v = null;
    try { v = qs.get("view") ? JSON.parse(qs.get("view")) : null; } catch (e) {}
    if (qs.get("diff")) loadDiff(+qs.get("diff"));
    else if (v) openViewSpec({ ...v, version_id: S.vid });
    else openTab("findings");
    await loadComments(true);
    setInterval(() => loadComments().catch(() => {}), 4000);
  } catch (e) { $("hint").textContent = e.message; $("hint").className = "msg err"; }
})();
</script>
</body>
</html>
